# Nome do Workflow
name: Build and deploy ASP.Net Core app to Azure Web App - EntArtesWebApp

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # 1. Instalar o .NET 10
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # 2. Instalar o Node.js (Necessário para o build do Vite/React)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Versão estável recomendada para React 19

      # 3. Restaurar dependências do .NET
      - name: dotnet restore
        run: dotnet restore ./DanceSchoolApp.Server/DanceSchoolApp.Server.csproj

      # 4. Publish (Este comando vai automaticamente disparar o npm install e build do React)
      - name: dotnet publish
        run: dotnet publish ./DanceSchoolApp.Server/DanceSchoolApp.Server.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      # 5. Upload do artefacto final (API + React compilado em wwwroot)
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_92BCAAE1ACA44B8280031F07F3476C18 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9538D4CF046640E58A97F429F14A3595 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D330DD777FCF4AAEA955AD7EAD482C2C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EntArtesWebApp'
          slot-name: 'Production'
          package: .